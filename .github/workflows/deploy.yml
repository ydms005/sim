# GitHub Pages 자동 배포
# 아래 브랜치에 push 하면 사이트를 빌드해서 https://ydms005.github.io/sim/ 에 올립니다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 바꿔 주세요.
# 설정 전에 push 해서 실패한 실행은 저절로 다시 돌지 않습니다. 설정 후 Actions 탭 → Run workflow 로 한 번 실행하세요.
#
# update-academyinfo.yml(대학알리미 지표 업데이트)이 올리는 커밋은 GITHUB_TOKEN 으로 push 되어
# 위 push 트리거를 스스로 일으키지 못합니다(GitHub의 의도된 동작 — 무한 루프 방지). 그래서 그 워크플로가
# 끝나면 아래 workflow_run 트리거로 이 배포를 이어서 실행합니다(성공으로 끝났을 때만).
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/modest-babbage-sfv411
  # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  workflow_dispatch:
  workflow_run:
    workflows: ["대학알리미 지표 업데이트"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끝까지 마치고 다음 배포를 시작합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run 으로 실행됐다면 그 워크플로가 성공(커밋을 실제로 올림)했을 때만 배포합니다.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          # workflow_run 이벤트는 기본적으로 브랜치의 최신 커밋을 가져오지 않으므로, 그 실행이 만든 커밋을 지정합니다.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Node.js 22 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages 가 아직 켜져 있지 않으면 이 단계가 실패합니다("Get Pages site failed").
      # GITHUB_TOKEN 으로는 Pages 를 켤 수 없으므로(enablement 불가), 바로 멈추지 않고 다음 단계에서 한국어 안내를 남깁니다.
      - name: GitHub Pages 설정 확인
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Pages 설정이 안 되어 있으면 안내 후 중단
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages 설정이 필요합니다::저장소 Settings → Pages → Build and deployment → Source 를 'GitHub Actions' 로 바꾼 뒤, Actions 탭 → Deploy to GitHub Pages → Run workflow 로 배포를 다시 실행하세요. 설정만 바꾸면 이 실행이 저절로 다시 돌지는 않습니다."
          exit 1

      - name: 패키지 설치
        run: npm ci

      # prebuild 단계에서 data/*.csv 를 검사해 public/data/*.json 을 만든 뒤,
      # 타입 검사(tsc)와 Vite 빌드를 합니다. CSV 에 오류가 있으면 여기서 멈추고 배포하지 않습니다.
      - name: 데이터 변환 + 사이트 빌드
        run: npm run build
        env:
          # 저장소 주소에 맞는 기본 경로(예: /sim/). 사용자 지정 도메인이면 / 가 됩니다.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@v4
